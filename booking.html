<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Booking Closed · Sisters Squad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html { background:#12040a; min-height:100%; }
    body {
      min-height:100vh;
      font-family:'Inter',sans-serif;
      background:radial-gradient(ellipse at top, #3a0d1a 0%, #2b0a12 40%, #12040a 100%);
      color:#f5e9da;
      display:flex; align-items:center; justify-content:center;
      padding:24px;
      touch-action: manipulation;
    }
    .box { max-width:420px; text-align:center; }
    .box .org { font-size:11px; font-weight:600; letter-spacing:4px; text-transform:uppercase; color:#c9a227; }
    .box h1 { font-family:'Playfair Display',serif; font-size:28px; color:#e6b422; margin-top:14px; }
    .box p { font-size:14px; color:#c9b394; margin-top:12px; line-height:1.6; }
    .box a {
      display:inline-block; margin-top:26px; padding:13px 28px; font-size:14px; font-weight:700;
      color:#2b0a12; background:linear-gradient(180deg,#f2ca5a,#e6b422);
      border-radius:12px; text-decoration:none;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="org">Sisters Squad</div>
    <h1>Booking is currently closed</h1>
    <p>बाईपण भारी नाईट 3.0 has concluded and there is no active event open for booking right now. Check back on our home page for future events.</p>
    <a href="/">Back to home</a>
  </div>
</body>
</html>
